services:
  database:
    image: postgres:16
    ports:
      - '55432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -p 5432']
      interval: 2s
      timeout: 5s
      retries: 30

  web:
    build: .
    ports:
      - '3210:3210'
    environment:
      VITE_SERVER_PORT: 3210
      AUTH_TOKEN_SECRET: e2e-secret
      CHANNEL_KEY_MASTER: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      POLL_CLOSURE_INTERVAL_SECONDS: 1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SCHEMA: postgres
      DB_HOST: database
      DB_PORT: 5432
      DB_MIGRATIONS: true
      REDIS_HOST: cache
      REDIS_PORT: 6379
      LIVEKIT_HOST: 127.0.0.1
      LIVEKIT_PORT: 37880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
      livekit:
        condition: service_started

  cache:
    image: redis:8.4.0

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - '37880:7880'
      - '37881:7881'
      - '37882:7882/udp'
    command: --dev --bind 0.0.0.0
