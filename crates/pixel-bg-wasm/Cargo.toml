[package]
name = "pixel-bg-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "Window",
]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
