[workspace]
members = ["api", "entity", "migrations"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[package]
name = "praxis-live"
version.workspace = true
edition.workspace = true

[workspace.dependencies]
axum = "0.8"
dotenv = "0.15"
jsonwebtoken = "9"
mime_guess = "2"
password-auth = "1"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies]
api = { path = "./api" }
axum.workspace = true
dotenv.workspace = true
migrations = { path = "./migrations" }
sea-orm.workspace = true
sea-orm-migration.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
