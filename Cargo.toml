[workspace]
members = ["api", "entity", "migrations"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[package]
name = "praxis-live"
version.workspace = true
edition.workspace = true

[workspace.dependencies]
axum = "0.8"
casbin = "2"
dashmap = "6"
dotenv = "0.15"
jsonwebtoken = "9"
mime_guess = "2"
password-auth = "1"
redis = "0.27"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres", "with-chrono", "with-uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dependencies]
api = { path = "./api" }
