services:
  web:
    build: .
    ports:
      - '${VITE_SERVER_PORT}:${VITE_SERVER_PORT}'
    env_file: .env
    environment:
      DB_HOST: database
      REDIS_HOST: cache
      LIVEKIT_URL: ws://localhost:${LIVEKIT_PORT}
      LIVEKIT_API_URL: http://livekit:${LIVEKIT_PORT}
      LIVEKIT_HOST: livekit
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
      livekit:
        condition: service_started
        required: false

  database:
    image: postgres:16
    ports:
      - '${DB_PORT}:${DB_PORT}'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_SCHEMA}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    container_name: cache
    image: redis:8.4.0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -p ${REDIS_PORT} -a ${REDIS_PASSWORD} ping | grep PONG',
        ]
      interval: 1s
      timeout: 3s
      retries: 5
    command: redis-server --port ${REDIS_PORT} --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    restart: always
    env_file: .env
    volumes:
      - cache:/data

  livekit:
    image: livekit/livekit-server:latest
    environment:
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_PORT}
        rtc:
          tcp_port: ${LIVEKIT_RTC_TCP_PORT}
          udp_port: ${LIVEKIT_RTC_UDP_PORT}
          use_external_ip: false
          node_ip: 127.0.0.1
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://web:${VITE_SERVER_PORT}/api/livekit/webhook
    ports:
      - '${LIVEKIT_PORT}:${LIVEKIT_PORT}'
      - '${LIVEKIT_RTC_TCP_PORT}:${LIVEKIT_RTC_TCP_PORT}'
      - '${LIVEKIT_RTC_UDP_PORT}:${LIVEKIT_RTC_UDP_PORT}/udp'
    command: --dev --bind 0.0.0.0
    profiles: ['livekit']

volumes:
  postgres_data:
  cache:
